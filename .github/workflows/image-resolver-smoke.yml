name: Image Resolver Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Test shared image resolver
        run: |
          node --input-type=module <<'NODE'
          import { findBestCommonsImage, downloadAndProcessHero } from './scripts/lib/shared-image-resolver.mjs';

          const search = await findBestCommonsImage({
            queries: ['Lake County Illinois river'],
            keywords: ['lake county', 'illinois', 'river'],
            minScore: 60,
            minKeywordMatches: 1,
            requirePhoto: true,
            perQuery: 5,
          });

          console.log('Search result:', JSON.stringify({
            found: search.found,
            candidatesEvaluated: search.candidatesEvaluated,
            eligibleCandidates: search.eligibleCandidates,
            topScore: search.topScore,
            searches: search.searches,
            best: search.best ? {
              title: search.best.image.title,
              license: search.best.image.license,
              sourcePageUrl: search.best.image.sourcePageUrl,
              score: search.best.score,
              keywordMatches: search.best.keywordMatches,
            } : null,
          }, null, 2));

          if (!search.found || !search.best?.image) {
            throw new Error('No reusable test image found.');
          }

          const processed = await downloadAndProcessHero({
            candidate: search.best.image,
            outputDir: '.tmp/image-resolver-smoke',
            slug: 'smoke-test',
            suffix: 'real',
            keepOriginal: false,
          });

          console.log('Processed image:', JSON.stringify(processed, null, 2));

          if (!processed.ok) {
            throw new Error(`Image processing failed: ${processed.reason}`);
          }

          if (processed.width !== 1200 || processed.height !== 675) {
            throw new Error(`Unexpected hero dimensions: ${processed.width}x${processed.height}`);
          }

          console.log('FULL IMAGE PIPELINE PASSED: 1200x675 reusable hero created.');
          NODE