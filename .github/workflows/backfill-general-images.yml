name: Backfill General News Images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Backfill reusable General News photos
        run: node scripts/backfill-fallback-images.mjs

      - name: Validate General News
        run: npm run validate:general

      - name: Validate publishing
        run: npm run validate:publishing

      - name: Build site
        run: npm run build

      - name: Validate launch
        run: npm run validate:launch

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- src/content/articles public/images data/published-stories.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push image backfill
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "US News Engine Bot"
          git config user.email "newsroom@users.noreply.github.com"
          git add src/content/articles public/images data/published-stories.json
          git commit -m "Backfill licensed General News images"
          git pull --rebase --autostash origin main
          git push

      - name: Deploy to Cloudflare
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        if: steps.changes.outputs.changed == 'true'
        run: |
          sleep 8
          BASE="https://usa-news-engine.forexwizardy.workers.dev"
          curl --fail --silent --show-error --max-time 20 "${BASE}/" > /dev/null
          curl --fail --silent --show-error --max-time 20 "${BASE}/latest/" > /dev/null
          echo "LIVE CHECK: PASS"