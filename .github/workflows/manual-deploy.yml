name: Manual Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the same deployment lock as automated newsrooms so a manual deploy
# cannot race a content-writing workflow on main.
concurrency:
  group: newsroom-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Validate science
        run: npm run validate:science
        continue-on-error: true

      - name: Validate publishing
        run: npm run validate:publishing

      - name: Check Hollywood newsroom logic
        run: |
          node --check scripts/fetch-general-news.mjs
          node --check scripts/build-general-news-stories.mjs
          node --test scripts/tests/general-news-category.test.mjs

      - name: Validate Movies release data
        run: npm run validate:movies

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        run: |
          sleep 8
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://usa-news-engine.forexwizardy.workers.dev/")
          echo "Homepage HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "LIVE CHECK FAILED"
            exit 1
          fi

          MOVIES_HTTP=$(curl -sSL -o /dev/null -w "%{http_code}" --max-time 20 "https://usa-news-engine.forexwizardy.workers.dev/movies/")
          echo "Movies hub HTTP status: $MOVIES_HTTP"
          if [ "$MOVIES_HTTP" != "200" ]; then
            echo "MOVIES HUB LIVE CHECK FAILED"
            exit 1
          fi

          VERIFY_URL="https://usa-news-engine.forexwizardy.workers.dev/googled0f9d56f69cf9cd9.html"
          # Workers static assets default to auto-trailing-slash: /file.html
          # responds with 307 to /file. Follow the redirect before comparing
          # the token, rather than comparing the HTML redirect response.
          VERIFY_FILE=$(mktemp)
          VERIFY_HTTP=$(curl -sSL --retry 2 --max-time 25 -o "$VERIFY_FILE" -w "%{http_code}" "$VERIFY_URL")
          echo "Google verification final HTTP status (following redirects): $VERIFY_HTTP"
          if [ "$VERIFY_HTTP" != "200" ]; then
            echo "GOOGLE VERIFICATION URL FAILED — expected 200"
            rm -f "$VERIFY_FILE"
            exit 1
          fi
          VERIFY_BODY=$(cat "$VERIFY_FILE")
          rm -f "$VERIFY_FILE"
          echo "Google verification content fetched after redirects"
          if [ "$VERIFY_BODY" != "google-site-verification: googled0f9d56f69cf9cd9.html" ]; then
            echo "GOOGLE VERIFICATION CHECK FAILED"
            exit 1
          fi

          echo "LIVE CHECK: PASS"
