name: Manual Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the same deployment lock as automated newsrooms so a manual deploy
# cannot race a content-writing workflow on main.
concurrency:
  group: newsroom-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Validate science
        run: npm run validate:science
        continue-on-error: true

      - name: Validate publishing
        run: npm run validate:publishing

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        run: |
          sleep 8
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://usa-news-engine.forexwizardy.workers.dev/")
          echo "Homepage HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "LIVE CHECK FAILED"
            exit 1
          fi
          echo "LIVE CHECK: PASS"
