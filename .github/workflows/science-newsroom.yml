name: Science Newsroom Automation

on:
  workflow_dispatch:
  schedule:
    # Run 4 times daily at 02:32, 08:32, 14:32, 20:32 UTC.
    # Minute 32 is offset to avoid top-of-hour load on GitHub Actions
    # runners and to clear away from the NWS (hourly), recall (08:17 /
    # 20:17), and earthquake (hourly at :47) newsroom schedules.
    - cron: '32 2,8,14,20 * * *'

permissions:
  contents: write

# Phase 10A concurrency safety: only one newsroom run at a time per
# branch. Prevents races with other desks or manual dispatches.
concurrency:
  group: newsroom-science-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      # -----------------------------------------------------------------
      # Phase 9D.2 — CI persistence.
      #
      # Every scheduled run starts from a FRESH runner. The only state
      # that survives between runs is what is COMMITTED to the repo:
      #   - src/content/articles/*.md           (published articles)
      #   - public/images/*                      (published images)
      #   - data/published-science.json          (published-story registry)
      #   - data/science/science-source-registry.json  (source identity/history)
      #
      # The science-source-registry.json is the CANONICAL fallback for
      # cross-source duplicate protection and source-dependency decisions
      # when JPL (or NASA/SWPC) is degraded. It MUST be committed when it
      # changes so the next fresh checkout has the updated source identities.
      #
      # Untracked / gitignored files (last-known-good cache, source-health
      # diagnostics, deferred-candidates diagnostics) are NOT relied on for
      # correctness — they are per-runner runtime optimizations only.
      # -----------------------------------------------------------------

      - name: Run Science Newsroom Automation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run newsroom:science

      - name: Read automation config
        id: config
        run: |
          PUBLISHING=$(node -e "const c=JSON.parse(require('fs').readFileSync('config/automation.json','utf8'));console.log(c.sciencePublishingEnabled)")
          echo "publishing=$PUBLISHING" >> $GITHUB_OUTPUT

      - name: Check for content changes
        id: content
        run: |
          # Content changes = published articles, public images, or the
          # published-science registry. These trigger build + deploy.
          if git diff --quiet -- src/ public/ data/published-science.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for registry changes
        id: registry
        run: |
          # The science-source-registry is durable state (source identity /
          # history). It is committed when it changes so the next fresh
          # checkout has updated source identities for cross-source
          # duplicate protection. Registry-only changes do NOT trigger a
          # build or deploy (no public content changed).
          if git diff --quiet -- data/science/science-source-registry.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build for deployment
        if: steps.content.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: npm run build

      - name: Commit and push changes
        if: |
          (steps.content.outputs.changed == 'true' || steps.registry.outputs.changed == 'true') &&
          steps.config.outputs.publishing == 'true'
        run: |
          git config user.name "US News Engine Bot"
          git config user.email "newsroom@users.noreply.github.com"
          # Content changes (articles, images, published-science registry).
          git add src/ public/ data/published-science.json 2>/dev/null || true
          # Durable source identity/history (canonical resilience fallback).
          git add data/science/science-source-registry.json 2>/dev/null || true
          # Only commit if there is something staged.
          if git diff --cached --quiet; then
            echo "Nothing staged — skipping commit."
          else
            git commit -m "Automated science newsroom update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Phase 10A: rebase onto the latest remote main before pushing
            # so concurrent workflow runs do not collide. Never force-push main.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Deploy to Cloudflare Workers
        # Deploy ONLY when public content changed (not for registry-only changes).
        if: steps.content.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        if: steps.content.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: |
          sleep 8
          BASE="https://usa-news-engine.forexwizardy.workers.dev"
          fail=0
          for path in "/" "/science/" "/latest/"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE}${path}")
            echo "Live check ${path} -> HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "LIVE CHECK FAILED — ${path} returned ${HTTP_CODE}"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "LIVE CHECK: PASS (all 3 pages returned HTTP 200)"

      - name: No-change notification
        if: steps.content.outputs.changed == 'false' && steps.registry.outputs.changed == 'false'
        run: echo "✓ Run completed — no content or registry changes (publishing=$(steps.config.outputs.publishing))."

      - name: Registry-only notification
        if: steps.content.outputs.changed == 'false' && steps.registry.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: echo "✓ Run completed — source registry updated (durable identity persisted); no public content change, no deploy."
