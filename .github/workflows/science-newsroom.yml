name: Science Newsroom Automation

on:
  workflow_dispatch:
  schedule:
    # Run 4 times daily at 02:32, 08:32, 14:32, 20:32 UTC.
    # Minute 32 is offset to avoid top-of-hour load on GitHub Actions
    # runners and to clear away from the NWS (hourly), recall (08:17 /
    # 20:17), and earthquake (hourly at :47) newsroom schedules.
    - cron: '32 2,8,14,20 * * *'

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Run Science Newsroom Automation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run newsroom:science

      - name: Read automation config
        id: config
        run: |
          PUBLISHING=$(node -e "const c=JSON.parse(require('fs').readFileSync('config/automation.json','utf8'));console.log(c.sciencePublishingEnabled)")
          echo "publishing=$PUBLISHING" >> $GITHUB_OUTPUT

      - name: Check for content changes
        id: changes
        run: |
          # Only consider content changes (science articles, public images,
          # and the published-science registry). Transient fetched science
          # data files under data/science/ are NOT considered content
          # changes.
          if git diff --quiet -- src/ public/ data/published-science.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "NO CONTENT CHANGES — skipping commit and deploy"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build for deployment
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: npm run build

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: |
          git config user.name "US News Engine Bot"
          git config user.email "newsroom@users.noreply.github.com"
          git add src/ public/ data/published-science.json
          git commit -m "Automated science newsroom update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: |
          sleep 8
          BASE="https://usa-news-engine.forexwizardy.workers.dev"
          fail=0
          for path in "/" "/science/" "/latest/"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${BASE}${path}")
            echo "Live check ${path} -> HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "LIVE CHECK FAILED — ${path} returned ${HTTP_CODE}"
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "LIVE CHECK: PASS (all 3 pages returned HTTP 200)"

      - name: No-change notification
        if: steps.changes.outputs.changed == 'false' || steps.config.outputs.publishing != 'true'
        run: echo "✓ Run completed — no content changes to publish or deploy (publishing=$(steps.config.outputs.publishing))."
