name: NWS Newsroom Automation

on:
  workflow_dispatch:
  schedule:
    # Phase 10A.1: run every 2 hours at minute 17 (00:17, 02:17, 04:17, ...)
    # Offset to avoid top-of-hour load on GitHub Actions runners.
    - cron: '17 */2 * * *'

permissions:
  contents: write

# Phase 10A concurrency safety: only one newsroom run at a time per
# branch. A scheduled run that fires while another is in-flight (or
# while a manual dispatch is running) is cancelled rather than racing
# on the same git ref. This prevents two runs from pulling the same
# old main, both creating commits, and one failing to push.
concurrency:
  group: newsroom-shared-${{ github.ref }}
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Run NWS Newsroom Automation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run newsroom:nws

      - name: Read automation config
        id: config
        run: |
          PUBLISHING=$(node -e "const c=JSON.parse(require('fs').readFileSync('config/automation.json','utf8'));console.log(c.nwsPublishingEnabled)")
          echo "publishing=$PUBLISHING" >> $GITHUB_OUTPUT

      - name: Check for content changes
        id: changes
        run: |
          # Only consider content changes (articles, data, public images)
          # Ignore changes to data/nws-*.json (transient fetched data)
          if git diff --quiet -- src/ public/ data/published-stories.json data/image-provenance.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "NO CONTENT CHANGES — skipping commit and deploy"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build for deployment
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: npm run build

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: |
          git config user.name "US News Engine Bot"
          git config user.email "newsroom@users.noreply.github.com"
          git add src/ public/ data/published-stories.json data/image-provenance.json
          git commit -m "Automated NWS newsroom update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Phase 10A: rebase onto the latest remote main before pushing
          # so concurrent workflow runs (e.g. NWS + Recall at 08:17/20:17)
          # do not collide. If the rebase fails, the run aborts safely
          # rather than force-pushing or overwriting another desk's commit.
          git pull --rebase --autostash origin main
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live site
        if: steps.changes.outputs.changed == 'true' && steps.config.outputs.publishing == 'true'
        run: |
          sleep 8
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://usa-news-engine.forexwizardy.workers.dev/")
          echo "Homepage HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "LIVE CHECK FAILED — homepage returned $HTTP_CODE"
            exit 1
          fi
          echo "LIVE CHECK: PASS"

      - name: No-change notification
        if: steps.changes.outputs.changed == 'false' || steps.config.outputs.publishing != 'true'
        run: echo "✓ Run completed — no content changes to publish or deploy (publishing=$(steps.config.outputs.publishing))."
