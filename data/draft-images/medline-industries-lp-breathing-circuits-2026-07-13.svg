<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Recall notice for Breathing Circuits from Medline Industries, LP">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c2c"/>
      <stop offset="1" stop-color="#07315a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#f4f5f3"/>

  <!-- Left dark panel -->
  <rect x="0" y="0" width="520" height="675" fill="url(#panelGrad)"/>

  <!-- Top accent strip -->
  <rect x="0" y="0" width="1200" height="8" fill="#0f4d8a"/>

  <!-- RECALL eyebrow -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#0f4d8a" letter-spacing="4">RECALL NOTICE</text>
    <rect x="0" y="14" width="60" height="3" fill="#0f4d8a"/>
  </g>

  <!-- RECALL headline (large, white on dark) -->
  <text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ffffff" letter-spacing="2">RECALL</text>

  <!-- Product name (left panel) -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f4d8a" letter-spacing="2">PRODUCT</text>
    <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#ffffff">Breathing Circuits</text>
  </g>

  <!-- Recalling firm (left panel) -->
  <g transform="translate(50, 290)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f4d8a" letter-spacing="2">RECALLING FIRM</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Medline Industries, LP</text>
  </g>

  <!-- Agency attribution on left panel (bottom) -->
  <g transform="translate(50, 605)">
    <rect x="0" y="-4" width="4" height="28" fill="#0f4d8a"/>
    <text x="14" y="10" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">U.S. FOOD AND DRUG ADMINISTRATION</text>
    <text x="14" y="26" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#b8c0c8">Source: FDA recall record</text>
  </g>

  <!-- US News Engine branding (left panel, bottom) -->
  <text x="50" y="651" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff">US News Engine</text>
  <text x="180" y="651" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#8a94a0" letter-spacing="0.5">EDITORIAL NOTICE</text>

  <!-- Right light panel -->
  <rect x="520" y="0" width="680" height="675" fill="#ffffff"/>

  <!-- Hazard label chip (right panel, top) -->
  <g transform="translate(560, 70)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">HAZARD</text>
    <rect x="0" y="14" width="123" height="32" rx="3" fill="#0f4d8a"/>
    <text x="61.5" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">BURN HAZARD</text>
  </g>

  <!-- Reason text (right panel) -->
  <g transform="translate(560, 150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">REASON FOR RECALL</text>
    <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#23262b">Neonatal and infant heated wire breathing circuits</text>
    <text x="0" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#23262b">may experience sporadic failure. The heated wire</text>
    <text x="0" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#23262b">connector (pigtail) at the humidifier may exhibit</text>
    <text x="0" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#23262b">discoloration, melting, smoke, burning odor, or</text>
    <text x="0" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#23262b">other signs of localized thermal damage. Device</text>
  </g>

  <!-- Data callouts (right panel, bottom) -->
  <g transform="translate(560, 463)">
    
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b7178" letter-spacing="1.5">CLASSIFICATION</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14161a">Class II</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b7178" letter-spacing="1.5">RECALL DATE</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14161a">July 13, 2026</text>
    </g>
    <g transform="translate(0, 76)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b7178" letter-spacing="1.5">UNITS</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14161a">416,931 units</text>
    </g>
    <g transform="translate(0, 114)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#6b7178" letter-spacing="1.5">DISTRIBUTION</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14161a">Worldwide distribution</text>
    </g>
  </g>

  <!-- Right-panel US News Engine branding (bottom right) -->
  <text x="1150" y="651" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="end">US News Engine</text>
  <text x="1150" y="665" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8f96" text-anchor="end" letter-spacing="0.5">EDITORIAL GRAPHIC</text>
</svg>