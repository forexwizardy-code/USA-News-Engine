<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Science graphic: Hubble Space Telescope — Spiral Galaxy NGC 4698">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#102844"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f3"/>
      <stop offset="1" stop-color="#e8ecee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rightGrad)"/>

  <!-- Left dark call-out panel -->
  <rect x="0" y="0" width="540" height="675" fill="url(#panelGrad)"/>

  <!-- Top accent strip (spans both panels) -->
  <rect x="0" y="0" width="1200" height="8" fill="#c8102e"/>

  <!-- ================== LEFT PANEL (dark call-out) ================== -->

  <!-- SCIENCE eyebrow + red underline -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ff6b7a" letter-spacing="4">SCIENCE</text>
    <rect x="0" y="14" width="60" height="3" fill="#c8102e"/>
  </g>

  <!-- Mission subtitle (small caps, muted) -->
  <text x="50" y="138" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9aa6b2" letter-spacing="3">NASA · ESA</text>

  <!-- Big mission/telescope name -->
  <text x="50" y="185" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="1">HUBBLE SPACE TELESCOPE</text>

  <!-- Red divider under mission name -->
  <rect x="50" y="215" width="80" height="2" fill="#c8102e"/>

  <!-- TOPIC label + topic text -->
  <text x="50" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" letter-spacing="2">TOPIC</text>
  <text x="50" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#ffffff">Spiral Galaxy NGC 4698</text>

  <!-- Optional fact callout (italic, lighter) -->
  <text x="50" y="335" font-family="Georgia, serif" font-size="17" font-weight="400" font-style="italic" fill="#cdd5dd">Unusual outer spiral-arm structure</text>

  <!-- Source + date block (bottom of left panel) -->
  <g transform="translate(50, 525)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" letter-spacing="2">SOURCE</text>
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">NASA</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#b8c0c8">SEPTEMBER 25, 2026</text>
  </g>

  <!-- US News Engine branding (bottom of left panel) -->
  <text x="50" y="653" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff">US News Engine</text>

  <!-- ================== RIGHT PANEL (light fact sheet) ================== -->

  <!-- DISCOVERY eyebrow + red underline -->
  <g transform="translate(600, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#c8102e" letter-spacing="4">DISCOVERY</text>
    <rect x="0" y="14" width="60" height="3" fill="#c8102e"/>
  </g>

  <!-- Big topic heading (right panel, for emphasis) -->
  <text x="600" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#14161a">Spiral Galaxy NGC 4698</text>

  <!-- Optional fact line (italic, muted) -->
  <text x="600" y="195" font-family="Georgia, serif" font-size="18" font-weight="400" font-style="italic" fill="#3a4148">Unusual outer spiral-arm structure</text>

  <!-- Subtitle context (small caps, muted) -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7178" letter-spacing="2">NASA · ESA</text>

  <!-- Divider line across right panel -->
  <line x1="600" y1="265" x2="1150" y2="265" stroke="#cfd6dd" stroke-width="1"/>

  <!-- KEY FACTS section label -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">KEY FACTS</text>

  <!-- Source row -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8f96" letter-spacing="1.5">SOURCE</text>
  <text x="600" y="365" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#14161a">NASA</text>

  <!-- Image type row -->
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8f96" letter-spacing="1.5">IMAGE TYPE</text>
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#14161a">Editorial Data Graphic</text>

  <!-- Credit row -->
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8f96" letter-spacing="1.5">CREDIT</text>
  <text x="600" y="495" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#14161a">US News Engine using NASA source information</text>

  <!-- Bottom-right branding -->
  <text x="1150" y="635" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="end">US News Engine</text>
  <text x="1150" y="653" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8f96" text-anchor="end" letter-spacing="0.5">EDITORIAL DATA GRAPHIC · NOT A PHOTOGRAPH</text>

</svg>