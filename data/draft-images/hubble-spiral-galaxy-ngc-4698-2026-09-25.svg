<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Science graphic: Hubble Space Telescope — Spiral Galaxy NGC 4698">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#102844"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f3"/>
      <stop offset="1" stop-color="#e8ecee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#rightGrad)"/>

  <!-- Left dark panel -->
  <rect x="0" y="0" width="520" height="675" fill="url(#panelGrad)"/>

  <!-- Top accent strip -->
  <rect x="0" y="0" width="1200" height="8" fill="#c8102e"/>

  <!-- Eyebrow + headline (left panel) -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ff6b7a" letter-spacing="4">SCIENCE</text>
    <rect x="0" y="14" width="60" height="3" fill="#c8102e"/>
  </g>

  <!-- Big mission/telescope name (left panel) -->
  <text x="50" y="190" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="2">HUBBLE SPACE TELESCOPE</text>
  <text x="50" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#9aa6b2" letter-spacing="2">NASA · ESA</text>

  <!-- Topic block (left panel, lower) -->
  <g transform="translate(50, 290)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" letter-spacing="2">DISCOVERY</text>
    <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#ffffff">SPIRAL GALAXY NGC 4698</text>
  </g>

  <!-- Source + date (left panel, bottom) -->
  <g transform="translate(50, 545)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" letter-spacing="2">SOURCE</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">NASA</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#b8c0c8">SEPTEMBER 25, 2026</text>
  </g>

  <!-- US News Engine branding (left panel, bottom) -->
  <text x="50" y="653" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff">US News Engine</text>
  <text x="180" y="653" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#8a94a0" letter-spacing="0.5">EDITORIAL DATA GRAPHIC</text>

  <!-- Right light panel content -->
  <!-- Stylized orbital arc motif (NOT a simulated photo) -->
  <g transform="translate(920, 337.5)">
    <circle r="160" fill="none" stroke="#cfd6dd" stroke-width="1" stroke-dasharray="3 6"/>
    <ellipse rx="200" ry="80" fill="none" stroke="#d8dde2" stroke-width="1" stroke-dasharray="2 5" transform="rotate(-15)"/>
    <ellipse rx="120" ry="60" fill="none" stroke="#d8dde2" stroke-width="1" stroke-dasharray="2 5" transform="rotate(25)"/>
    <circle r="40" fill="#0a1320" stroke="#c8102e" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ff6b7a" text-anchor="middle" letter-spacing="1">NASA</text>
  </g>

  <!-- Right-panel topic label (top) -->
  <g transform="translate(560, 70)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">STORY TOPIC</text>
    <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#14161a">Spiral Galaxy NGC 4698</text>
  </g>

  <!-- Right-panel US News Engine branding (bottom right) -->
  <text x="1150" y="651" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#14161a" text-anchor="end">US News Engine</text>
  <text x="1150" y="665" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8f96" text-anchor="end" letter-spacing="0.5">EDITORIAL DATA GRAPHIC · NOT A PHOTOGRAPH</text>
</svg>