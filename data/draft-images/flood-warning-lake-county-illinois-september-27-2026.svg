<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Flood Warning graphic for Lake County, Illinois">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a5e"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f8b"/>
      <stop offset="1" stop-color="#0f4a5e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#1f6f8b"/>

  <!-- Left content column -->
  <g transform="translate(80, 0)">
    <!-- Event icon -->
    
    <g transform="translate(0 140) scale(2.2)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <path d="M-40 -10 Q-20 -22 0 -10 T40 -10"/>
      <path d="M-40 5 Q-20 -7 0 5 T40 5"/>
      <path d="M-40 20 Q-20 8 0 20 T40 20"/>
    </g>

    <!-- Event headline -->
    <text x="0" y="220" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="2">FLOOD WARNING</text>

    <!-- Accent divider -->
    <rect x="0" y="245" width="80" height="5" fill="#1f6f8b"/>

    <!-- Location -->
    <text x="0" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#ffffff">Lake County, Illinois</text>

    <!-- Water body (if applicable) -->
    <text x="0" y="340" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#b8c4cc">Des Plaines River</text>

    <!-- In-effect label -->
    <text x="0" y="395" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#8ab4c8">In effect through Monday afternoon</text>
  </g>

  <!-- Right column: U.S. locator -->
  
  <g transform="translate(740, 130)">
    <!-- Locator panel background -->
    <rect x="-20" y="-20" width="380" height="360" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Locator label -->
    <text x="170" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#8ab4c8" text-anchor="middle" letter-spacing="2">LOCATION</text>

    <!-- Simplified U.S. silhouette -->
    <g transform="translate(20, 40) scale(0.36)">
      <path d="M0.0 11.6 L17.1 104.4 L17.1 220.4 L85.5 336.4 L136.8 406.0 L153.8 406.0 L239.3 429.2 L290.6 452.4 L376.1 475.6 L427.4 498.8 L461.5 545.2 L478.6 545.2 L529.9 522.0 L581.2 475.6 L615.4 452.4 L649.6 452.4 L683.8 475.6 L717.9 452.4 L735.0 498.8 L769.2 545.2 L786.3 568.4 L820.5 568.4 L854.7 522.0 L752.1 475.6 L786.3 382.8 L854.7 313.2 L854.7 266.8 L888.9 220.4 L940.2 174.0 L974.4 127.6 L974.4 58.0 L923.1 81.2 L854.7 104.4 L786.3 150.8 L717.9 174.0 L649.6 174.0 L683.8 104.4 L598.3 34.8 L512.8 11.6 L256.4 11.6 L85.5 11.6 L0.0 11.6 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
      <!-- State marker -->
      <circle cx="611.9658119658119" cy="220.4" r="26" fill="#1f6f8b" opacity="0.35"/>
      <circle cx="611.9658119658119" cy="220.4" r="14" fill="#1f6f8b"/>
      <circle cx="611.9658119658119" cy="220.4" r="6" fill="#ffffff"/>
    </g>

    <!-- State name below map -->
    <text x="170" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8ab4c8" text-anchor="middle" letter-spacing="2">ILLINOIS</text>
  </g>
  

  <!-- Bottom attribution bar -->
  <rect x="0" y="619" width="1200" height="56" fill="rgba(0,0,0,0.4)"/>

  <!-- NWS attribution -->
  <g transform="translate(80, 653)">
    <rect x="0" y="-16" width="4" height="20" fill="#1f6f8b"/>
    <text x="14" y="-2" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">NATIONAL WEATHER SERVICE</text>
    <text x="280" y="-2" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#8a949c">Source: NWS alert</text>
  </g>

  <!-- US News Engine branding (subtle, right) -->
  <g transform="translate(1120, 653)">
    <text x="0" y="-2" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end" letter-spacing="1">US News Engine</text>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#6a747c" text-anchor="end">EDITORIAL GRAPHIC</text>
  </g>
</svg>