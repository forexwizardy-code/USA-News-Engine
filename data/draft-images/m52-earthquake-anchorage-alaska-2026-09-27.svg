<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Map showing the epicenter of a magnitude 5.2 earthquake near Anchorage, Alaska">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c2c"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- Top accent strip -->
  <rect x="0" y="0" width="1200" height="6" fill="#c8102e"/>

  <!-- Top header band -->
  <rect x="0" y="6" width="1200" height="78" fill="url(#headerGrad)"/>

  <!-- Eyebrow + headline -->
  <g transform="translate(60, 38)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#ff6b7a" letter-spacing="3">U.S. GEOLOGICAL SURVEY · EARTHQUAKE</text>
    <text x="0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="2">M5.2 EARTHQUAKE</text>
  </g>

  <!-- Right-side metadata readout -->
  <g transform="translate(1140, 38)" text-anchor="end">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9aa6b2" letter-spacing="2">SEPTEMBER 27, 2026</text>
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">61.2250°N, 149.7350°W</text>
  </g>

  <!-- Map window + gridlines + region label -->
  
  <!-- Map window border -->
  <rect x="60" y="110" width="1080" height="480" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="2" rx="4"/>
  <!-- Lat/lon gridlines (every 10°) -->
  <g stroke="#e0e4e8" stroke-width="1" stroke-dasharray="2 4">
    <line x1="60" y1="374" x2="1140" y2="374"/>
    <line x1="60" y1="134" x2="1140" y2="134"/>
    <line x1="60" y1="110" x2="60" y2="590"/>
    <line x1="276" y1="110" x2="276" y2="590"/>
    <line x1="492" y1="110" x2="492" y2="590"/>
    <line x1="708" y1="110" x2="708" y2="590"/>
    <line x1="924" y1="110" x2="924" y2="590"/>
  </g>
  <!-- Region label -->
  <text x="72" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5a6470" letter-spacing="1">ALASKA</text>
  

  <!-- Epicenter marker -->
  
  <!-- Epicenter marker -->
  <g transform="translate(713.7 344.6)">
    <circle r="41" fill="#c8102e" fill-opacity="0.10"/>
    <circle r="27.879999999999995" fill="#c8102e" fill-opacity="0.20"/>
    <circle r="16.4" fill="#c8102e" fill-opacity="0.35"/>
    <circle r="8.2" fill="#c8102e"/>
    <line x1="-49.199999999999996" y1="0" x2="-19.679999999999996" y2="0" stroke="#c8102e" stroke-width="1.5"/>
    <line x1="19.679999999999996" y1="0" x2="49.199999999999996" y2="0" stroke="#c8102e" stroke-width="1.5"/>
    <line x1="0" y1="-49.199999999999996" x2="0" y2="-19.679999999999996" stroke="#c8102e" stroke-width="1.5"/>
    <line x1="0" y1="19.679999999999996" x2="0" y2="49.199999999999996" stroke="#c8102e" stroke-width="1.5"/>
  </g>

  <!-- Place + depth callout (left bottom) -->
  <g transform="translate(60, 565)">
    <rect x="-4" y="-22" width="4" height="56" fill="#c8102e"/>
    <text x="12" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">EPICENTER</text>
    <text x="12" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#14161a">Anchorage, Alaska</text>
    <text x="12" y="34" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6470">Depth: 28.5 km · Alaska</text>
  </g>

  <!-- Magnitude + tsunami/alert callout (right bottom) -->
  <g transform="translate(1140, 565)" text-anchor="end">
    <text x="0" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7178" letter-spacing="2">MAGNITUDE</text>
    <text x="0" y="32" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#c8102e">M5.2</text>
    
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c8102e" letter-spacing="1">PAGER ALERT: YELLOW</text>
  </g>

  <!-- USGS attribution + US News Engine branding (bottom strip) -->
  <rect x="0" y="639" width="1200" height="36" fill="#0f1c2c"/>
  <text x="60" y="661" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#9aa6b2">Source: U.S. Geological Survey · earthquake.usgs.gov</text>
  <text x="1140" y="661" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">US News Engine</text>
  <text x="1000" y="661" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#5a6470" text-anchor="end" letter-spacing="0.5">EDITORIAL DATA GRAPHIC</text>
</svg>