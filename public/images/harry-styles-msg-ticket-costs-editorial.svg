<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Harry Styles New York residency ticket prices</title>
  <desc id="desc">Original editorial graphic showing a concert ticket and New York skyline; not a photograph of Harry Styles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c36"/><stop offset="1" stop-color="#283b61"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="#43597e" opacity=".58">
    <rect x="50" y="420" width="86" height="255"/><rect x="154" y="380" width="116" height="295"/>
    <rect x="297" y="455" width="65" height="220"/><rect x="375" y="342" width="100" height="333"/>
    <rect x="995" y="367" width="105" height="308"/><rect x="1113" y="442" width="67" height="233"/>
  </g>
  <g transform="rotate(-4 602 339)">
    <rect x="173" y="154" width="852" height="372" rx="23" fill="#f5eee1"/>
    <rect x="173" y="154" width="852" height="64" rx="22" fill="#e54c48"/>
    <rect x="173" y="194" width="852" height="24" fill="#e54c48"/>
    <text x="219" y="197" font-family="Arial,sans-serif" font-size="26" letter-spacing="6" font-weight="bold" fill="white">HOLLYWOOD / MUSIC</text>
    <path d="M835 220V523" stroke="#9f9b97" stroke-width="3" stroke-dasharray="12 12"/>
    <g fill="#111c36" font-family="Arial,sans-serif">
      <text x="218" y="289" font-size="30" font-weight="bold" letter-spacing="4">HARRY STYLES</text>
      <text x="218" y="356" font-size="49" font-weight="bold">Concert ticket costs</text>
      <text x="218" y="407" font-size="27">New York City residency</text>
      <text x="218" y="469" font-size="21" letter-spacing="2" fill="#625e5a">EDITORIAL ILLUSTRATION • NO PRICE CLAIMS</text>
      <text x="880" y="307" font-size="24" font-weight="bold">NYC</text>
      <text x="872" y="380" font-size="49" font-weight="bold">♪</text>
      <text x="864" y="461" font-size="19">LIVE</text>
    </g>
  </g>
  <text x="1150" y="636" text-anchor="end" fill="#e4e9f4" font-family="Arial,sans-serif" font-size="19">US NEWS ENGINE</text>
</svg>
